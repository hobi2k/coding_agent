[project]
name = "coding-agent"
version = "0.1.0"
description = "Local coding agent powered by GGUF/Ollama + LangGraph"
requires-python = ">=3.11"
dependencies = [
    # LangGraph 에이전트 프레임워크
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",   # OpenAI 호환 엔드포인트 연결
    "langchain-community>=0.3", # DuckDuckGo 검색 도구
    # 웹 검색
    "duckduckgo-search>=6.0",
    # CLI
    "requests",
    "rich",
    "prompt_toolkit",
    # HuggingFace GGUF 다운로드
    "huggingface-hub",
    "hf-transfer",
]

[project.scripts]
agent        = "coding_agent.cli:main"
agent-server = "coding_agent.server:main"
agent-dl     = "coding_agent.download:main"
agent-setup  = "coding_agent.ollama_runtime:install_project_local_ollama"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coding_agent"]
