[project]
name = "coding-agent"
version = "0.1.0"
description = "Local coding agent powered by vllm + HuggingFace"
requires-python = ">=3.11"
dependencies = [
    "vllm",
    "requests",
    "rich",
    "prompt_toolkit",
    "huggingface-hub",   # 모델 다운로드용
]

[project.scripts]
agent        = "coding_agent.cli:main"
agent-server = "coding_agent.server:main"
agent-dl     = "coding_agent.download:main"

[tool.uv]
# 프로젝트 로컬 venv 사용
dev-dependencies = []

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux'" }
]

[[tool.uv.indexes]]
name     = "pytorch-cuda"
url      = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coding_agent"]
